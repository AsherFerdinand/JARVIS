name: Windows build
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra audio --group packaging
      - run: uv run --extra audio --group packaging pip-audit --progress-spinner off
      - id: tests
        run: uv run --extra audio pytest -v --junitxml=.cache/test-results.xml
      - if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: uv run python scripts/report_tests.py .cache/test-results.xml
      - run: uv run --extra audio --group packaging python scripts/package_baseline.py
      - run: uv run --extra audio --group packaging python scripts/package_windows.py
      - run: uv run python scripts/measure_windows.py
      - run: uv run python scripts/benchmark.py
      - run: uv run --extra audio python scripts/benchmark_voice.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: JARVIS-0.5.0-windows
          path: |
            dist/JARVIS-0.5.0-windows.zip
            dist/JARVIS-0.5.0-windows.zip.sha256
            dist/artifact-metrics.json
            dist/baseline-artifact-metrics.json
            dist/baseline-windows-resources.json
            dist/windows-resources.json
            dist/portable-validation.json
          if-no-files-found: error
