name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v
      - run: uv build
      - run: uv run python scripts/check_package.py
      - run: uv run --extra audio --group packaging pip-audit --progress-spinner off
      - run: uv run python scripts/benchmark.py
      - run: uv run python scripts/benchmark_voice.py
      - run: uv run python scripts/benchmark_reliability.py
