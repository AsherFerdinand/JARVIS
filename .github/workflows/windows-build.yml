name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra audio --group packaging
      - run: uv run --extra audio --group packaging pip-audit --progress-spinner off
      - run: uv run --extra audio pytest -v
      - run: uv run --extra audio --group packaging python scripts/package_windows.py
      - run: uv run python scripts/benchmark.py
      - run: uv run --extra audio python scripts/benchmark_voice.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JARVIS-0.2.0-windows
          path: |
            dist/JARVIS-0.2.0-windows.zip
            dist/JARVIS-0.2.0-windows.zip.sha256
            dist/artifact-metrics.json
          if-no-files-found: error
